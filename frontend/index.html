<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f9fb" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1017" />
    <meta
      name="description"
      content="ExamForge — course management, question banks, proctored exams, auto-grading and certification."
    />
    <title>ExamForge — Assessment Platform</title>
    <script>
      // Apply the stored theme before first paint. Doing this in React instead
      // would flash the light palette on every load for dark-theme users.
      (function () {
        try {
          var stored = localStorage.getItem('examforge-theme');
          var dark =
            stored === 'dark' ||
            (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* private mode: fall back to the light palette */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
